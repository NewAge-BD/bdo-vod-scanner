name: Bug report
description: Report a reproducible problem using privacy-safe synthetic data.
title: '[Bug]: '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve BDO VOD Scanner.

        Do not include real logs, player or guild names, local paths, VODs, project files, exported media, credentials, or screenshots containing private data. Reduce the problem to a synthetic example before submitting it publicly. Use the Security tab for vulnerabilities.
  - type: input
    id: app_version
    attributes:
      label: App version
      description: The version shown in the application footer.
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 140, Edge 140, or Brave 1.x
    validations:
      required: true
  - type: input
    id: operating_system
    attributes:
      label: Operating system
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe what went wrong without including imported content or local paths.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Privacy-safe reproduction steps
      description: Use synthetic names and small synthetic files whenever possible.
      placeholder: |
        1. Create a new project
        2. Import a synthetic log and MP4
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: technical_metadata
    attributes:
      label: Optional technical metadata
      description: Codec, resolution, frame rate, approximate file size, capability flags, or an error code only. Do not include filenames or paths.
  - type: checkboxes
    id: privacy_confirmation
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed real names, logs, paths, media, project files, and other sensitive data.
          required: true
        - label: I searched the existing issues for this problem.
          required: true
